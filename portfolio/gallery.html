<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Title + meta are set dynamically from gallery-data.js -->
  <title>UJPhotography</title>
  <meta name="description" content="" id="metaDesc" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@200;300;400;500&display=swap" />

  <style>
    /* ══════════════════════════════════════════
       DESIGN TOKENS
    ══════════════════════════════════════════ */
    :root {
      --ink:        #0f0d0b;
      --ink-soft:   #1c1814;
      --cream:      #f2ede6;
      --cream-dim:  rgba(242,237,230,0.72);
      --warm-gray:  #7a746c;
      --gold:       #b8966a;
      --gold-light: #d4b48a;
      --gold-dim:   rgba(184,150,106,0.18);
      --off-white:  #f9f6f1;
      --border:     rgba(242,237,230,0.12);
      --border-gold:rgba(184,150,106,0.38);
      --ease-out:   cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ══════════════════════════════════════════
       RESET & BASE
    ══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body { height: 100%; }

    body {
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      color: var(--cream);
      background: var(--ink);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }
    button { background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }

    /* ══════════════════════════════════════════
       FILM GRAIN OVERLAY
    ══════════════════════════════════════════ */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 180px;
    }

    /* ══════════════════════════════════════════
       HEADER
    ══════════════════════════════════════════ */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 62px;
      background: rgba(15,13,11,0.94);      /* solid, so nav stays readable over photos */
      transition: background 0.4s var(--ease-out), backdrop-filter 0.4s;
    }
    .header.scrolled {
      background: rgba(15,13,11,0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: var(--cream);
      white-space: nowrap;
      transition: color 0.2s;
    }
    .brand em { font-style: normal; color: var(--gold-light); }
    .brand:hover { color: var(--gold-light); }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cream-dim);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 1px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      white-space: nowrap;
    }
    .home-link svg { transition: transform 0.2s var(--ease-out); }
    .home-link:hover { color: var(--gold-light); border-color: var(--border-gold); background: var(--gold-dim); }
    .home-link:hover svg { transform: translateX(-3px); }

    .nav {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
      overflow-x: auto;                     /* scrolls sideways if links don't fit */
      scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav a {
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(242,237,230,0.86);
      padding: 8px 12px;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .nav a:hover { color: var(--gold-light); }
    .nav a.active {
      color: var(--gold-light);
      border-color: var(--gold);
    }

    /* ══════════════════════════════════════════
       SHARED CONTROLS (lightbox arrows + spinner)
    ══════════════════════════════════════════ */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(15,13,11,0.32);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--cream);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.22s, border-color 0.22s, color 0.22s, transform 0.18s var(--ease-out);
    }
    .arrow:hover { background: rgba(184,150,106,0.22); border-color: var(--border-gold); color: var(--gold-light); }
    .arrow:active { transform: translateY(-50%) scale(0.95); }
    .arrow.prev { left: 22px; }
    .arrow.next { right: 22px; }

    .loader-ring {
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ══════════════════════════════════════════
       SERIES SECTION
    ══════════════════════════════════════════ */
    .series {
      background: var(--off-white);
      color: var(--ink);
      padding: 96px 28px 88px;
    }
    .series-inner { max-width: 1140px; margin: 0 auto; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .eyebrow-line { width: 32px; height: 1px; background: var(--gold); flex-shrink: 0; }
    .eyebrow-text { font-size: 0.6rem; letter-spacing: 0.46em; text-transform: uppercase; color: var(--gold); }

    .series-heading {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2.8rem, 6vw, 4.6rem);
      line-height: 1.08;
      letter-spacing: -0.01em;
      color: #1a1714;
      margin-bottom: 24px;
    }
    .series-heading em { font-style: italic; color: #6b5e4e; }

    .series-body {
      font-size: 1rem;
      line-height: 1.92;
      color: #5a534b;
      max-width: 680px;
      margin-bottom: 52px;
      letter-spacing: 0.01em;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, #d8d0c4, transparent);
      margin-bottom: 44px;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1px;
      background: #e2dbd2;
      border: 1px solid #e2dbd2;
      margin-bottom: 52px;
    }
    .note { background: var(--off-white); padding: 28px 26px 24px; transition: background 0.22s; }
    .note:hover { background: #fff; }
    .note-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 300;
      color: #c8bfb3;
      line-height: 1;
      margin-bottom: 10px;
    }
    .note h3 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 1.22rem;
      color: #1e1b18;
      margin-bottom: 10px;
    }
    .note p { font-size: 0.93rem; line-height: 1.78; color: #6b635b; }

    .cta-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      font-family: 'Raleway', sans-serif;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      transition: background 0.22s, color 0.22s, border-color 0.22s;
    }
    .btn-primary { background: #1a1714; color: var(--off-white); border: 1px solid #1a1714; }
    .btn-primary:hover { background: var(--gold); border-color: var(--gold); color: #fff; }
    .btn-ghost { background: transparent; color: #1a1714; border: 1px solid #c0b8ad; }
    .btn-ghost:hover { border-color: #1a1714; background: #1a1714; color: var(--off-white); }

    /* ══════════════════════════════════════════
       OVERVIEW GRID — every photo in the series
    ══════════════════════════════════════════ */
    .overview {
      background: var(--ink);
      padding: 80px 28px 96px;              /* just clears the fixed header */
      min-height: 100svh;
    }
    .overview-inner { width: 100%; }
    /* Page title stays in the HTML for search engines / screen readers,
       but isn't shown — the photos and the nav bar speak for themselves. */
    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .overview-empty {
      padding: 30vh 0;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--warm-gray);
    }
    .photo-grid {
      opacity: 0;
      animation: fadeUp 0.8s var(--ease-out) forwards;
    }

    /* Masonry: photos keep their natural shape. JS places each photo in the
       shortest column so the order reads left-to-right, top-to-bottom. */
    .photo-grid { display: flex; align-items: flex-start; gap: 14px; }
    .photo-col  { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
    .photo-tile {
      display: block;
      width: 100%;
      position: relative;
      overflow: hidden;
      background: var(--ink-soft);
      cursor: zoom-in;
    }
    .photo-tile img {
      display: block;
      width: 100%;
      height: auto;
      transform: scale(1);
      transition: transform 0.9s var(--ease-out), opacity 0.6s;
      opacity: 0;
    }
    .photo-tile img.loaded { opacity: 1; }
    .photo-tile::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(15,13,11,0);
      transition: background 0.5s var(--ease-out);
      pointer-events: none;
    }
    .photo-tile:hover img,
    .photo-tile:focus-visible img { transform: scale(1.06); }
    .photo-tile:hover::after { background: rgba(15,13,11,0.12); }
    .photo-tile:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; }

    /* ══════════════════════════════════════════
       LIGHTBOX
    ══════════════════════════════════════════ */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(12,10,8,0.985);
      display: grid;
      place-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s var(--ease-out), visibility 0s linear 0.35s;
    }
    .lightbox.open {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.35s var(--ease-out);
    }
    body.lb-open { overflow: hidden; }

    .lb-figure {
      position: absolute;
      inset: 64px 84px;
      display: grid;
      place-items: center;
    }
    .lb-img {                               /* whole photo always fits the screen */
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transform: scale(0.985);
      transition: opacity 0.35s var(--ease-out), transform 0.5s var(--ease-out);
    }
    .lb-img.loaded { opacity: 1; transform: scale(1); }
    .lb-spinner { position: absolute; }
    .lb-img.loaded + .lb-spinner { display: none; }

    .lb-counter {
      position: absolute;
      top: 22px; left: 28px;
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      color: var(--cream-dim);
    }
    .lb-counter .current-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--gold);
      line-height: 1;
    }
    .lb-close {
      position: absolute;
      top: 14px; right: 18px;
      width: 44px; height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--cream);
      border-radius: 50%;
      transition: color 0.2s, background 0.2s;
    }
    .lb-close:hover { color: var(--gold-light); background: rgba(242,237,230,0.06); }
    .lightbox .arrow { z-index: 2; }

    /* ══════════════════════════════════════════
       FOOTER
    ══════════════════════════════════════════ */
    .footer {
      background: var(--ink-soft);
      border-top: 1px solid var(--border);
      padding: 26px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-brand { font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; letter-spacing: 0.18em; color: var(--cream-dim); }
    .footer-brand em { color: var(--gold); font-style: normal; }
    .footer-copy { font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--warm-gray); }

    /* ══════════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════════ */
    @media (max-width: 768px) {
      .home-link { display: none; }
      .header { gap: 12px; }
      .nav {                                /* swipe sideways when links don't fit */
        gap: 0;
        min-width: 0;
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12px, #000 calc(100% - 20px), transparent 100%);
                mask-image: linear-gradient(to right, transparent 0, #000 12px, #000 calc(100% - 20px), transparent 100%);
      }
      .nav::-webkit-scrollbar { display: none; }
      .nav a { padding: 8px 9px; font-size: 0.68rem; letter-spacing: 0.14em; }
      .arrow { width: 40px; height: 40px; }
      .arrow.prev { left: 12px; }
      .arrow.next { right: 12px; }
      .series { padding: 64px 22px 60px; }
      .notes-grid { grid-template-columns: 1fr; }
      .footer { justify-content: center; text-align: center; }
      .overview { padding: 72px 8px 64px; }
      .photo-grid, .photo-col { gap: 8px; }
      .lb-figure { inset: 64px 0 72px; }
      .lightbox .arrow { top: auto; bottom: 14px; transform: none; }
      .lightbox .arrow:active { transform: scale(0.95); }
    }

    @media (max-width: 480px) {
      .header { padding: 0 16px; }
      .nav a { padding: 8px 8px; font-size: 0.66rem; letter-spacing: 0.12em; }
    }

    /* ══════════════════════════════════════════
       PAGE ENTER ANIMATION
    ══════════════════════════════════════════ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .series-heading,
    .eyebrow,
    .series-body,
    .divider,
    .notes-grid,
    .cta-row {
      opacity: 0;
      animation: fadeUp 0.7s var(--ease-out) forwards;
    }
    .eyebrow        { animation-delay: 0.05s; }
    .series-heading { animation-delay: 0.15s; }
    .series-body    { animation-delay: 0.25s; }
    .divider        { animation-delay: 0.32s; }
    .notes-grid     { animation-delay: 0.38s; }
    .cta-row        { animation-delay: 0.46s; }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════════════
       HEADER — nav links injected by JS
  ══════════════════════════════════════════ -->
  <header class="header" id="siteHeader" role="banner">
    <a class="home-link" href="../index.html" aria-label="Back to Home">
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
      </svg>
      Home
    </a>
    <a class="brand" href="../index.html" aria-label="UJPhotography — Home">UJ<em>Photography</em></a>
    <nav class="nav" id="siteNav" aria-label="Portfolio sections"></nav>
  </header>

  <main>
    <!-- ══════════════════════════════════════════
         OVERVIEW GRID — tiles injected by JS
    ══════════════════════════════════════════ -->
    <section class="overview" id="overview" aria-labelledby="overviewTitle">
      <div class="overview-inner">
        <h1 class="visually-hidden" id="overviewTitle"></h1>
        <div class="photo-grid" id="photoGrid"></div>
      </div>
    </section>

    <!-- ══════════════════════════════════════════
         SERIES WRITE-UP — populated by JS
    ══════════════════════════════════════════ -->
    <section class="series" aria-labelledby="seriesHeading">
      <div class="series-inner">
        <div class="eyebrow">
          <span class="eyebrow-line" aria-hidden="true"></span>
          <span class="eyebrow-text" id="seriesEyebrow"></span>
        </div>
        <h2 id="seriesHeading" class="series-heading"></h2>
        <p class="series-body" id="seriesBody"></p>
        <div class="divider" aria-hidden="true"></div>
        <div class="notes-grid" id="notesGrid"></div>
        <div class="cta-row">
          <a class="btn btn-primary" href="mailto:ujwaljohnsonphotography@gmail.com">
            Book a Session
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/>
            </svg>
          </a>
          <a class="btn btn-ghost" href="../index.html#portfolio">Back to Home</a>
        </div>
      </div>
    </section>
  </main>

  <!-- ══════════════════════════════════════════
       LIGHTBOX
  ══════════════════════════════════════════ -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
    <div class="lb-counter" aria-live="polite" aria-atomic="true">
      <span class="current-num" id="lbCurrent">01</span>
      <span class="sep">/</span>
      <span id="lbTotal"></span>
    </div>
    <button class="lb-close" id="lbClose" aria-label="Close photo viewer">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>
    <div class="lb-figure" id="lbFigure">
      <img class="lb-img" id="lbImg" alt="" />
      <div class="loader-ring lb-spinner" aria-hidden="true"></div>
    </div>
    <button class="arrow prev" id="lbPrev" aria-label="Previous photo">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
      </svg>
    </button>
    <button class="arrow next" id="lbNext" aria-label="Next photo">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/>
      </svg>
    </button>
  </div>

  <!-- ══════════════════════════════════════════
       FOOTER
  ══════════════════════════════════════════ -->
  <footer class="footer">
    <span class="footer-brand">UJ<em>Photography</em></span>
    <span class="footer-copy">&copy; <span id="footerYear"></span> Ujwal Johnson · All rights reserved</span>
  </footer>

  <!-- Load gallery data first -->
  <script src="gallery-data.js"></script>
  <script src="gallery-images.js"></script>

  <script>
    'use strict';

    /* ══════════════════════════════════════════
       NAV SERIES DEFINITION
       (mirrors gallery-data.js keys + display labels)
    ══════════════════════════════════════════ */
    const NAV_SERIES = [
      { key: 'portraiture',   label: 'Portraiture'  },
      { key: 'landscape',     label: 'Landscape'     },
      { key: 'wedding',       label: 'Wedding'       },
      { key: 'street',        label: 'Street'        },
      { key: 'automotive',    label: 'Automotive'    },
      { key: 'realestate',    label: 'Real\u00a0Estate' },
      { key: 'localbusiness', label: 'Business'      },
    ];

    /* ══════════════════════════════════════════
       RESOLVE CURRENT SERIES FROM URL
    ══════════════════════════════════════════ */
    const params    = new URLSearchParams(window.location.search);
    const seriesKey = (params.get('series') || '').toLowerCase().trim() || 'portraiture';
    const data      = GALLERY_DATA[seriesKey];

    if (!data) {
      /* Unknown series — redirect to default */
      window.location.replace('gallery.html?series=portraiture');
    }

    /* ══════════════════════════════════════════
       POPULATE PAGE META
    ══════════════════════════════════════════ */
    document.title = data.pageTitle;
    document.getElementById('metaDesc').setAttribute('content', data.metaDesc);

    /* ══════════════════════════════════════════
       BUILD NAV
    ══════════════════════════════════════════ */
    const navEl = document.getElementById('siteNav');
    /* Series with no photos yet are left out of the nav */
    NAV_SERIES.filter(({ key }) => (GALLERY_IMAGES[key] || []).length).forEach(({ key, label }) => {
      const a = document.createElement('a');
      a.href = `gallery.html?series=${key}`;
      a.textContent = label;
      if (key === seriesKey) {
        a.classList.add('active');
        a.setAttribute('aria-current', 'page');
      }
      navEl.appendChild(a);
    });
    /* On small screens, make sure the current section's link is visible */
    const activeLink = navEl.querySelector('.active');
    if (activeLink) navEl.scrollLeft = activeLink.offsetLeft - navEl.offsetLeft - 24;

    /* ══════════════════════════════════════════
       POPULATE SERIES COPY
    ══════════════════════════════════════════ */
    document.getElementById('seriesEyebrow').textContent = data.eyebrow;

    const headingEl = document.getElementById('seriesHeading');
    headingEl.textContent = data.heading;
    if (data.headingSub) {
      headingEl.insertAdjacentHTML('beforeend', `<br><em>${data.headingSub}</em>`);
    }

    document.getElementById('seriesBody').textContent = data.body;

    const notesGrid = document.getElementById('notesGrid');
    data.notes.forEach((note, i) => {
      const div = document.createElement('div');
      div.className = 'note';
      div.innerHTML = `
        <div class="note-num" aria-hidden="true">${String(i + 1).padStart(2, '0')}</div>
        <h3>${note.title}</h3>
        <p>${note.text}</p>
      `;
      notesGrid.appendChild(div);
    });

    /* ══════════════════════════════════════════
       MISC UTILITIES
    ══════════════════════════════════════════ */
    document.getElementById('footerYear').textContent = new Date().getFullYear();

    const header = document.getElementById('siteHeader');
    const onScroll = () => header.classList.toggle('scrolled', window.scrollY > 4);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    /* ══════════════════════════════════════════
       OVERVIEW GRID + LIGHTBOX MODULE
    ══════════════════════════════════════════ */
    (function Overview() {
      const IMAGE_DIR = data.imageDir;
      const PHOTOS    = GALLERY_IMAGES[seriesKey] || [];
      const pad       = n => String(n).padStart(2, '0');

      /* Real pixel width of a generated file (its longest edge is `edge`,
         never upscaled) — srcset needs true widths, esp. for portrait shots. */
      const widthAt = (p, edge) => Math.round(p.w * Math.min(1, edge / Math.max(p.w, p.h)));
      const srcset  = (p, edges) =>
        edges.map(e => `${IMAGE_DIR}${p.n}-${e}.webp ${widthAt(p, e)}w`).join(', ');

      const grid = document.getElementById('photoGrid');

      document.getElementById('overviewTitle').textContent = `${data.heading} — Portfolio`;
      if (!PHOTOS.length) {
        grid.outerHTML = '<p class="overview-empty">Photos coming soon</p>';
        return;
      }

      /* ── Build tiles ── */
      const tiles = PHOTOS.map((p, i) => {
        const base = IMAGE_DIR + p.n;
        const a = document.createElement('a');
        a.className = 'photo-tile';
        a.href = `${base}-2400.webp`;           // still works without JS
        a.setAttribute('aria-label', `Open photograph ${i + 1} of ${PHOTOS.length}`);

        const img = document.createElement('img');
        img.alt = '';
        img.loading = i < 6 ? 'eager' : 'lazy';  // first screenful loads right away
        if (i < 3) img.fetchPriority = 'high';
        img.decoding = 'async';
        img.width = p.w;                        // reserves space → no layout jump
        img.height = p.h;
        img.sizes = '(max-width: 768px) 50vw, (min-width: 1600px) 25vw, 33vw';
        img.srcset = srcset(p, [600, 1200]);
        img.src = `${base}-600.webp`;
        img.addEventListener('load', () => img.classList.add('loaded'), { once: true });

        a.appendChild(img);
        a.addEventListener('click', e => { e.preventDefault(); open(i); });
        return a;
      });

      /* ── Masonry layout: 2 / 3 / 4 columns depending on screen width ── */
      const narrow = window.matchMedia('(max-width: 768px)');
      const wide   = window.matchMedia('(min-width: 1600px)');
      function layout() {
        const count = narrow.matches ? 2 : wide.matches ? 4 : 3;
        const cols = Array.from({ length: count }, () => {
          const c = document.createElement('div');
          c.className = 'photo-col';
          return c;
        });
        const heights = new Array(count).fill(0);
        tiles.forEach((tile, i) => {
          const k = heights.indexOf(Math.min(...heights));
          cols[k].appendChild(tile);
          heights[k] += PHOTOS[i].h / PHOTOS[i].w;
        });
        grid.replaceChildren(...cols);
      }
      layout();
      narrow.addEventListener('change', layout);
      wide.addEventListener('change', layout);

      /* ── Lightbox ── */
      const lb      = document.getElementById('lightbox');
      const lbImg   = document.getElementById('lbImg');
      const lbCur   = document.getElementById('lbCurrent');
      const lbClose = document.getElementById('lbClose');
      const lbPrev  = document.getElementById('lbPrev');
      const lbNext  = document.getElementById('lbNext');
      const lbFig   = document.getElementById('lbFigure');
      document.getElementById('lbTotal').textContent = pad(PHOTOS.length);

      let index = 0;
      let isOpen = false;

      /* Where the photo actually sits inside the viewer (object-fit: contain) */
      function fittedBox(p) {
        const f = lbFig.getBoundingClientRect();
        const scale = Math.min(f.width / p.w, f.height / p.h);
        const w = p.w * scale, h = p.h * scale;
        return { left: f.left + (f.width - w) / 2, top: f.top + (f.height - h) / 2, w, h };
      }

      /* Point srcset/sizes at photo i so the browser downloads the right size */
      function setSource(img, i) {
        const p = PHOTOS[i];
        img.sizes = `${Math.ceil(fittedBox(p).w)}px`;
        img.srcset = srcset(p, [1200, 2400]);
        img.src = `${IMAGE_DIR}${p.n}-1200.webp`;
      }

      function preload(i) { setSource(new Image(), i); }

      function show(i) {
        index = (i + PHOTOS.length) % PHOTOS.length;
        lbImg.classList.remove('loaded');
        lbImg.onload = () => lbImg.classList.add('loaded');
        setSource(lbImg, index);
        lbImg.alt = `${data.heading} — photograph ${index + 1} of ${PHOTOS.length}`;
        lbCur.textContent = pad(index + 1);
        preload((index + 1) % PHOTOS.length);
        preload((index - 1 + PHOTOS.length) % PHOTOS.length);
      }

      function open(i) {
        isOpen = true;
        show(i);
        lb.classList.add('open');
        lb.setAttribute('aria-hidden', 'false');
        document.body.classList.add('lb-open');
        lbClose.focus();
      }

      function close() {
        if (!isOpen) return;
        isOpen = false;
        lb.classList.remove('open');
        lb.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('lb-open');
        tiles[index].focus();                   // return to the last photo viewed
      }

      lbClose.addEventListener('click', close);
      lbPrev.addEventListener('click', () => show(index - 1));
      lbNext.addEventListener('click', () => show(index + 1));

      /* Click on the dark backdrop (not the photo or buttons) closes.
         The <img> box fills the viewer, so check against the visible photo. */
      lb.addEventListener('click', e => {
        if (e.target === lb || e.target === lbFig) return close();
        if (e.target === lbImg) {
          const b = fittedBox(PHOTOS[index]);
          const inside = e.clientX >= b.left && e.clientX <= b.left + b.w &&
                         e.clientY >= b.top  && e.clientY <= b.top + b.h;
          if (!inside) close();
        }
      });

      document.addEventListener('keydown', e => {
        if (!isOpen) return;
        if (e.key === 'Escape')     { close(); }
        if (e.key === 'ArrowRight') { show(index + 1); }
        if (e.key === 'ArrowLeft')  { show(index - 1); }
        if (e.key === 'Tab') {                  // keep focus inside the viewer
          const f = [lbClose, lbPrev, lbNext];
          const at = f.indexOf(document.activeElement);
          e.preventDefault();
          f[(at + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
        }
      });

      let x0 = null;
      lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener('touchend', e => {
        if (x0 === null) return;
        const dx = e.changedTouches[0].clientX - x0;
        if (dx >  44) show(index - 1);
        if (dx < -44) show(index + 1);
        x0 = null;
      }, { passive: true });
    })();
  </script>

</body>
</html>
